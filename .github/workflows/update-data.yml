name: 更新 40日收益差数据

on:
  schedule:
    # 北京时间 16:30（UTC 08:30），周一至周五收盘后
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write        # 失败告警要开/关 issue

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 拉取 Wind 数据并生成 data.json
        env:
          WIND_API_KEY: ${{ secrets.WIND_API_KEY }}
        run: python scripts/fetch_data.py --out data/data.json

      - name: 校验数据文件非空
        run: |
          set -e
          test -s data/data.json
          test -s data/data.js
          python - <<'PY'
          import json, re
          d = json.load(open("data/data.json", encoding="utf-8"))
          assert d["series"]["dates"], "dates 为空"
          assert d["latest"]["spread_wind"] is not None, "最新收益差为空"
          # data.js 内联数据与 data.json 必须完全一致
          js = open("data/data.js", encoding="utf-8").read()
          m = re.search(r"window\.__SPREAD_DATA__=(\{.*\});\s*$", js, re.S)
          assert m, "data.js 未找到 window.__SPREAD_DATA__"
          assert json.loads(m.group(1)) == d, "data.js 与 data.json 不一致"
          print("OK  数据截至 %s  最新收益差 %.2f%%  交易日 %d"
                % (d["meta"]["end"], d["latest"]["spread_wind"], d["meta"]["trading_days"]))
          PY

      - name: 提交变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/data.js
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 更新 40日收益差数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # 2026-11 那次 Wind 接口故障：11-10~11-18 连续 7 个交易日失败，
      # 全程零告警，直到 11-19 上游自愈才恢复。页面兜底数据静默陈旧了 2 个月。
      # 下面两步把告警做成闭环：失败开单 / 恢复关单。
      - name: 失败告警（开单或追评）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, urllib.request

          tok, repo = os.environ["GH_TOKEN"], os.environ["REPO"]
          run_url = os.environ["RUN_URL"]
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          PREFIX = "[自动化] 数据更新失败"

          def api(method, path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(
                  "https://api.github.com" + path, data=data, method=method,
                  headers={"Authorization": "Bearer " + tok,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "User-Agent": "wb-alert"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode() or "null")

          issues = api("GET", "/repos/%s/issues?state=open&per_page=100" % repo) or []
          hit = next((i for i in issues
                      if i["title"].startswith(PREFIX) and "pull_request" not in i), None)

          detail = ("失败时间：%s\n运行记录：%s\n\n"
                    "排查顺序：① 打开该次运行 `拉取 Wind 数据` 步骤日志，看 "
                    "`Wind MCP 调用失败` 后面的完整报错（现在会带上响应体原文）；"
                    "② 若报「拒绝访问」或 HTTP 401/403，是凭据/额度问题；"
                    "③ 若连续多日失败，页面会标出「数据可能陈旧」，先确认上游是否恢复。"
                    % (now, run_url))

          if hit:
              api("POST", "/repos/%s/issues/%d/comments" % (repo, hit["number"]),
                  {"body": "**再一次失败** · " + detail})
              print("已追加评论到 issue #%d" % hit["number"])
          else:
              r = api("POST", "/repos/%s/issues" % repo,
                      {"title": "%s %s" % (PREFIX, now[:10]), "body": detail})
              print("已开 issue #%d" % r["number"])
          PY

      - name: 恢复正常（关闭告警单）
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          tok, repo = os.environ["GH_TOKEN"], os.environ["REPO"]
          PREFIX = "[自动化] 数据更新失败"

          def api(method, path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(
                  "https://api.github.com" + path, data=data, method=method,
                  headers={"Authorization": "Bearer " + tok,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "User-Agent": "wb-alert"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode() or "null")

          issues = api("GET", "/repos/%s/issues?state=open&per_page=100" % repo) or []
          for i in issues:
              if i["title"].startswith(PREFIX) and "pull_request" not in i:
                  api("POST", "/repos/%s/issues/%d/comments" % (repo, i["number"]),
                      {"body": "已恢复正常，自动关闭。"})
                  api("PATCH", "/repos/%s/issues/%d" % (repo, i["number"]), {"state": "closed"})
                  print("已关闭 issue #%d" % i["number"])
          PY
